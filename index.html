  <!-- Hardware Prototype Bridge -->
  <script>
/**
 * LaundryGO - Smart Locker Hardware & API Bridge
 * 
 * Modul ini berfungsi sebagai pondasi integrasi antara Mobile Web LaundryGO
 * dengan Prototype Hardware Smart Locker (ESP32, Arduino, Raspberry Pi, dsb).
 * 
 * Protokol yang didukung:
 * 1. WebSocket (Real-time bidirectional control: ws://<locker_ip>:81/ws)
 * 2. HTTP REST API (Locker unlock, status query, tare/weighing)
 * 3. MQTT Broker (Pub/Sub untuk monitoring jarak jauh)
 * 4. Web Serial API (Direct USB connection to microcontroller)
 */

class LockerHardwareBridge {
  constructor() {
    this.isConnected = false;
    this.endpoint = null;
    this.ws = null;
    this.listeners = new Map();
    this.mockMode = true; // Default to interactive simulation if hardware not connected
    
    // Status awal locker prototype (SBH President University)
    this.lockers = {
      A01: { id: 'A01', status: 'READY FOR PICKUP', doorOpen: false, pinCode: '8910', sensor: 'UV_ACTIVE', weight: 3.5 },
      A02: { id: 'A02', status: 'AVAILABLE', doorOpen: false, pinCode: null, sensor: 'EMPTY', weight: 0 },
      A03: { id: 'A03', status: 'OCCUPIED', doorOpen: false, pinCode: '2411', sensor: 'OCCUPIED', weight: 4.2 },
      B01: { id: 'B01', status: 'AVAILABLE', doorOpen: false, pinCode: null, sensor: 'EMPTY', weight: 0 },
      B02: { id: 'B02', status: 'AVAILABLE', doorOpen: false, pinCode: null, sensor: 'EMPTY', weight: 0 },
      B03: { id: 'B03', status: 'MAINTENANCE', doorOpen: false, pinCode: null, sensor: 'UV_SANITIZING', weight: 0 },
    };
  }

  /**
   * Subscribe ke event locker (doorOpen, doorClose, statusChange, weightReading, qrScanned)
   */
  on(event, callback) {
    if (!this.listeners.has(event)) {
      this.listeners.set(event, []);
    }
    this.listeners.get(event).push(callback);
    return () => this.off(event, callback);
  }

  off(event, callback) {
    if (!this.listeners.has(event)) return;
    const filtered = this.listeners.get(event).filter(cb => cb !== callback);
    this.listeners.set(event, filtered);
  }

  emit(event, data) {
    if (this.listeners.has(event)) {
      this.listeners.get(event).forEach(cb => {
        try {
          cb(data);
        } catch (e) {
          console.error(`[LockerBridge] Error in listener for event ${event}:`, e);
        }
      });
    }
  }

  /**
   * Hubungkan ke prototype hardware melalui WebSocket (ESP32 / NodeMCU)
   * Contoh: bridge.connectWebSocket('ws://192.168.1.150:81/ws')
   */
  connectWebSocket(url) {
    this.endpoint = url;
    console.log(`[LockerBridge] Connecting to Hardware Locker at ${url}...`);
    try {
      this.ws = new WebSocket(url);
      this.ws.onopen = () => {
        this.isConnected = true;
        this.mockMode = false;
        console.log('[LockerBridge] Connected to Smart Locker Hardware Prototype!');
        this.emit('connectionChange', { connected: true, endpoint: url });
      };

      this.ws.onmessage = (event) => {
        try {
          const payload = JSON.parse(event.data);
          this.handleHardwareMessage(payload);
        } catch (err) {
          console.warn('[LockerBridge] Raw message from hardware:', event.data);
        }
      };

      this.ws.onclose = () => {
        this.isConnected = false;
        this.mockMode = true;
        console.log('[LockerBridge] Hardware connection closed. Reverting to interactive simulation.');
        this.emit('connectionChange', { connected: false });
      };

      this.ws.onerror = (err) => {
        console.error('[LockerBridge] WebSocket Error:', err);
        this.emit('error', err);
      };
    } catch (e) {
      console.warn('[LockerBridge] Unable to create WebSocket. Running in standalone UI mode.', e);
    }
  }

  /**
   * Parsing data masuk dari mikrokontroler ESP32 / Arduino
   */
  handleHardwareMessage(payload) {
    // Format JSON dari hardware contoh:
    // { "type": "DOOR_TRIGGERED", "lockerId": "A01", "state": "OPEN" }
    // { "type": "LOAD_CELL_WEIGHT", "lockerId": "A01", "weightKg": 3.48 }
    // { "type": "OPTICAL_SCANNER_READ", "qrRaw": "LGO-SEC-3942-F8B1" }
    console.log('[LockerBridge] Hardware event received:', payload);
    switch (payload.type) {
      case 'DOOR_TRIGGERED':
        if (this.lockers[payload.lockerId]) {
          this.lockers[payload.lockerId].doorOpen = payload.state === 'OPEN';
        }
        this.emit('doorChange', payload);
        break;
      case 'LOAD_CELL_WEIGHT':
        this.emit('weightReading', payload);
        break;
      case 'OPTICAL_SCANNER_READ':
        this.emit('qrScanned', payload);
        break;
      default:
        this.emit('hardwareMessage', payload);
    }
  }

  /**
   * Kirim perintah BUKA PINTU SOLENOID ke locker
   * Mendukung koneksi hardware nyata atau simulasi instan
   */
  async unlockLocker(lockerId, authPayload = {}) {
    console.log(`[LockerBridge] Requesting UNLOCK for Locker ${lockerId}...`, authPayload);

    if (this.isConnected && this.ws && this.ws.readyState === WebSocket.OPEN) {
      const command = {
        action: 'UNLOCK',
        lockerId: lockerId,
        timestamp: Date.now(),
        auth: authPayload
      };
      this.ws.send(JSON.stringify(command));
    }

    // Update internal state
    if (this.lockers[lockerId]) {
      this.lockers[lockerId].doorOpen = true;
    }

    this.emit('doorChange', { lockerId, state: 'OPEN', by: authPayload.role || 'user' });

    return {
      success: true,
      lockerId,
      unlockedAt: new Date().toISOString(),
      message: `Locker ${lockerId} solenoid triggered successfully.`
    };
  }

  /**
   * Perintah KUNCI PINTU SOLENOID
   */
  async lockLocker(lockerId) {
    console.log(`[LockerBridge] Locking Locker ${lockerId}...`);

    if (this.isConnected && this.ws && this.ws.readyState === WebSocket.OPEN) {
      this.ws.send(JSON.stringify({ action: 'LOCK', lockerId, timestamp: Date.now() }));
    }

    if (this.lockers[lockerId]) {
      this.lockers[lockerId].doorOpen = false;
    }

    this.emit('doorChange', { lockerId, state: 'CLOSED' });
    return { success: true, lockerId };
  }

  /**
   * Verifikasi Optical Token QR dari Scanner Hardware
   */
  verifyQRToken(scannedToken, targetLockerId = 'A01') {
    if (!scannedToken) return { valid: false, reason: 'Token kosong' };
    
    // Verifikasi format token LaundryGO (LGO-SEC-xxxx atau OTP)
    const isValidFormat = scannedToken.startsWith('LGO-') || scannedToken.length >= 8;
    
    return {
      valid: isValidFormat,
      lockerId: targetLockerId,
      verifiedAt: new Date().toISOString(),
      token: scannedToken
    };
  }
}

// Inisialisasi singleton bridge global
const lockerBridge = new LockerHardwareBridge();
if (typeof window !== 'undefined') {
  window.LaundryGOHardwareBridge = lockerBridge;
}

if (typeof module !== 'undefined' && module.exports) {
  module.exports = { LockerHardwareBridge, lockerBridge };
}

class SoundFX {
  constructor() {
    this.ctx = null;
    this.muted = false;
  }

  init() {
    if (!this.ctx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (AudioContext) {
        this.ctx = new AudioContext();
      }
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  playSolenoidClick() {
    if (this.muted) return;
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(340, now);
    osc.frequency.exponentialRampToValueAtTime(45, now + 0.08);
    gain.gain.setValueAtTime(0.4, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.08);
  }

  playDoorOpen() {
    if (this.muted) return;
    this.init();
    if (!this.ctx) return;

    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.12);
  }

  playSuccessChime() {
    if (this.muted) return;
    this.init();
    if (!this.ctx) return;
    const notes = [523.25, 659.25, 783.99, 1046.50];
    notes.forEach((freq, idx) => {
      const now = this.ctx.currentTime + idx * 0.08;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(0.22, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.28);
    });
  }

  playPaymentChime() {
    if (this.muted) return;
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const freqs = [659.25, 987.77, 1318.51];
    freqs.forEach((freq, idx) => {
      const t = now + idx * 0.06;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, t);
      gain.gain.setValueAtTime(0.25, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(t);
      osc.stop(t + 0.3);
    });
  }

  playBuzzer() {
    if (this.muted) return;
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    [0, 0.14].forEach((offset) => {
      const t = now + offset;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';

      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(t);
      osc.stop(t + 0.1);
    });
  }

    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);

  }

    const newToken = `LGO-SEC-${randPart1}-${randPart2}-X${randCode}`;
    setQrToken(newToken);
    setQrCountdown(30);

    sound.playTokenRotate();

          )}

        </div>

        {/* ----------------------------------------------------------------- */}
        {/* BOTTOM NAVIGATION BAR (FIXED DOCKED AT BOTTOM - CUSTOMER ONLY)     */}
        {/* ----------------------------------------------------------------- */}
        {appMode === 'customer' && (
          <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto h-16 bg-white/95 backdrop-blur-md border-t border-slate-200 px-1 flex items-center justify-between z-40 shadow-[0_-4px_16px_rgba(0,0,0,0.06)]">
            {[
              { id: 'lockers', label: 'Lockers', icon: 'box' },
              { id: 'tracker', label: 'Tracker', icon: 'clock' },
              { id: 'qr', label: 'QR Pass', icon: 'qr-code' },
              { id: 'wallet', label: 'Wallet', icon: 'wallet' },
              { id: 'profile', label: 'Profile', icon: 'user' }
            ].map(tab => {
              const isActive = activeTab === tab.id;
              return (
                <button
                  key={tab.id}
                  onClick={() => {
                    setActiveTab(tab.id);
                    sound.playSolenoidClick();
                  }}
                  className={`flex-1 flex flex-col items-center justify-center py-1 px-1 rounded-xl transition-all ${
                    isActive
                      ? 'text-sky-600 font-extrabold'
                      : 'text-slate-400 hover:text-slate-700'
                  }`}
                >
                  <div className={`p-1 rounded-xl transition-all ${isActive ? 'bg-sky-50 text-sky-600' : ''}`}>
                    <Icon name={tab.icon} className="w-4 h-4" />
                  </div>
                  <span className="text-[10px] tracking-tight whitespace-nowrap">{tab.label}</span>
                </button>
              );
            })}
          </nav>
        )}

      </main>

      {/* =================================================================== */}
      {/* MODALS                                                              */}
      {/* =================================================================== */}

      {/* 1. GANTI AKUN MODAL */}
      {showChangeAccountModal && (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-sm w-full p-5 shadow-2xl border border-slate-200 space-y-4">
            <div className="flex justify-between items-center pb-2 border-b border-slate-100">
              <h3 className="text-sm font-black text-slate-900 flex items-center space-x-2">
                <Icon name="users" className="w-4 h-4 text-sky-600" />
                <span>Ganti Akun Pengguna</span>
              </h3>
              <button
                onClick={() => setShowChangeAccountModal(false)}
                className="text-slate-400 hover:text-slate-600 text-sm font-bold p-1"
              >
                ✕
              </button>
            </div>

            <div className="space-y-2">
              {accounts.map(acc => (
                <div
                  key={acc.id}
                  onClick={() => {
                    setAccounts(prev => prev.map(a => ({ ...a, active: a.id === acc.id })));
                    setShowChangeAccountModal(false);
                    sound.playSolenoidClick();
                    triggerToast('Akun Berhasil Diganti', `Selamat datang kembali, ${acc.name}!`, 'user');
                  }}
                  className={`p-3 rounded-2xl border cursor-pointer transition-all flex items-center justify-between ${
                    acc.active
                      ? 'bg-sky-50 border-sky-400 ring-2 ring-sky-200'
                      : 'bg-white border-slate-200 hover:border-slate-300'
                  }`}
                >
                  <div className="flex items-center space-x-3">
                    <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-sky-600 to-cyan-500 text-white font-bold text-xs flex items-center justify-center">
                      {acc.avatar}
                    </div>
                    <div>
                      <div className="text-xs font-bold text-slate-900">{acc.name}</div>
                      <div className="text-[10px] text-slate-500">{acc.tier} &bull; {acc.points} Poin</div>
                      <div className="text-[9px] text-slate-400">{acc.location}</div>
                    </div>
                  </div>
                  {acc.active && <span className="text-sky-600 font-bold text-sm">✓</span>}
                </div>
              ))}
            </div>

            <button
              onClick={() => {
                sound.playSolenoidClick();
                triggerToast('Tambah Akun', 'Fitur pendaftaran akun baru (UI Prototype)', 'users');
              }}
              className="w-full py-2 px-3 rounded-xl bg-slate-50 hover:bg-slate-100 text-slate-700 text-xs font-bold border border-slate-200"
            >
              + Tambah Akun Baru
            </button>
          </div>
        </div>
      )}

      {/* 2. DROP-OFF MODAL (PILIH LAYANAN DROP-OFF OLEH CUSTOMER) */}
      {showDropOffModal && (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-sm w-full p-5 shadow-2xl border border-slate-200 space-y-4">
            <div className="flex justify-between items-center pb-2 border-b border-slate-100">
              <h3 className="text-sm font-black text-slate-900 flex items-center space-x-2">
                <Icon name="box" className="w-4 h-4 text-sky-600" />
                <span>Drop-off Cucian ({selectedLockerId})</span>
              </h3>
              <button onClick={() => setShowDropOffModal(false)} className="text-slate-400 hover:text-slate-600 text-sm font-bold">✕</button>
            </div>

            <div className="space-y-2">
              <span className="text-xs font-bold text-slate-700 block">Pilih Paket Layanan yang Anda Inginkan:</span>
              {Object.keys(SERVICE_SPEED_TIERS).map(key => {
                const tier = SERVICE_SPEED_TIERS[key];
                const isSelected = customerChosenService === key;
                return (
                  <div
                    key={key}
                    onClick={() => handleCustomerSelectServiceTier(key)}
                    className={`p-3 rounded-2xl border cursor-pointer transition-all flex justify-between items-center ${
                      isSelected
                        ? 'bg-sky-50 border-sky-500 ring-2 ring-sky-200'
                        : 'bg-white border-slate-200 hover:border-slate-300'
                    }`}
                  >
                    <div>
                      <div className="text-xs font-bold text-slate-900 flex items-center space-x-1.5">
                        <span>{tier.name} ({tier.durationLabel})</span>
                        {isSelected && <span className="text-[10px] text-sky-600 font-bold">✓ Terpilih</span>}
                      </div>
                      <div className="text-[10px] text-slate-500 mt-0.5">{tier.desc}</div>
                    </div>
                    <span className="text-xs font-bold text-sky-700">Rp {tier.ratePerKg.toLocaleString('id-ID')}/kg</span>
                  </div>
                );
              })}
            </div>

            <button
              onClick={() => handleConfirmDropOff(selectedLockerId)}
              className="w-full py-2.5 rounded-xl bg-sky-600 hover:bg-sky-500 text-white font-extrabold text-xs shadow-md transition-all flex items-center justify-center space-x-2"
            >
              <Icon name="unlock" className="w-4 h-4" />
              <span>Buka Pintu {selectedLockerId} & Masukkan Baju</span>
            </button>
          </div>
        </div>
      )}

      {/* 3. HARDWARE SCANNER MODAL */}
      {showScannerModal && (
        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-sm w-full p-5 shadow-2xl border border-sky-400 text-center space-y-4">
            <div className="w-12 h-12 rounded-2xl bg-sky-50 border border-sky-200 text-sky-600 flex items-center justify-center mx-auto">
              <Icon name="scan" className="w-6 h-6 animate-pulse" />
            </div>

            <div>
              <h3 className="text-sm font-black text-slate-900">Membaca Sensor Locker SBH</h3>
              <p className="text-[11px] text-slate-500 mt-0.5">Memvalidasi Payload Kriptografis...</p>
            </div>

            <div className="p-3 rounded-2xl bg-slate-50 border border-slate-200 text-left font-mono text-[10px] space-y-1">
              <div className="text-sky-700 font-bold">PAYLOAD TOKEN: {qrToken}</div>
              <div className="text-slate-600">TARGET DOOR: LOCKER {customerOrder.lockerId}</div>
              <div className="text-emerald-600 font-bold">VERIFIKASI: VALID & OTORISASI DITERIMA</div>
            </div>

            <div className="flex space-x-2">
              <button
                onClick={() => setShowScannerModal(false)}
                className="flex-1 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs"
              >
                Batal
              </button>
              <button
                onClick={handleConfirmScannerAction}
                className="flex-1 py-2 rounded-xl bg-sky-600 hover:bg-sky-500 text-white font-extrabold text-xs shadow-md flex items-center justify-center space-x-1"
              >
                <Icon name="unlock" className="w-3.5 h-3.5" />
                <span>Buka Solenoid {customerOrder.lockerId}</span>
              </button>
            </div>
          </div>
        </div>
      )}

      {/* 4. TOP UP MODAL */}
      {showTopUpModal && (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-sm w-full p-5 shadow-2xl border border-slate-200 space-y-4">
            <div className="flex justify-between items-center pb-2 border-b border-slate-100">
              <h3 className="text-sm font-black text-slate-900 flex items-center space-x-2">
                <Icon name="wallet" className="w-4 h-4 text-sky-600" />
                <span>Top Up Saldo LaundryGO Pay</span>
              </h3>
              <button onClick={() => setShowTopUpModal(false)} className="text-slate-400 hover:text-slate-600 text-sm font-bold">✕</button>
            </div>

            <div className="grid grid-cols-2 gap-2">
              {[25000, 50000, 100000, 200000].map(amt => (
                <button
                  key={amt}
                  onClick={() => handleTopUp(amt)}
                  className="py-3 px-2 rounded-2xl bg-slate-50 hover:bg-sky-50 text-slate-800 hover:text-sky-700 text-xs font-black border border-slate-200 hover:border-sky-300 transition-all text-center"
                >
                  Rp {amt.toLocaleString('id-ID')}
                </button>
              ))}
            </div>
          </div>
        </div>
      )}

      {/* 5. HISTORY MODAL */}
      {showHistoryModal && (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-sm w-full p-5 shadow-2xl border border-slate-200 space-y-4 max-h-[85vh] flex flex-col">
            <div className="flex justify-between items-center pb-2 border-b border-slate-100">
              <h3 className="text-sm font-black text-slate-900 flex items-center space-x-2">
                <Icon name="clock" className="w-4 h-4 text-sky-600" />
                <span>Riwayat Transaksi SBH</span>
              </h3>
              <button onClick={() => setShowHistoryModal(false)} className="text-slate-400 hover:text-slate-600 text-sm font-bold">✕</button>
            </div>

            <div className="flex-1 overflow-y-auto space-y-2.5">
              <div className="p-3 rounded-2xl bg-sky-50 border border-sky-200 space-y-1">
                <div className="flex justify-between text-xs font-bold text-sky-900">
                  <span>{customerOrder.orderId} (Aktif)</span>
                  <span className="text-sky-700">Rp {customerOrder.totalDue.toLocaleString('id-ID')}</span>
                </div>
                <div className="text-[10px] text-slate-600">Locker {customerOrder.lockerId} &bull; {customerTierInfo.name} ({customerOrder.weightKg.toFixed(2)} kg)</div>
                <div className="text-[9px] font-bold text-emerald-600">{customerOrder.isPaid ? 'LUNAS' : 'MENUNGGU PEMBAYARAN'}</div>
              </div>

              <div className="p-3 rounded-2xl bg-slate-50 border border-slate-200 space-y-1">
                <div className="flex justify-between text-xs font-bold text-slate-800">
                  <span>#LDR-10210</span>
                  <span className="text-slate-700">Rp 44.400</span>
                </div>
                <div className="text-[10px] text-slate-500">18 Okt 2026 &bull; Regular Clean (6.2 kg)</div>
                <div className="text-[9px] font-bold text-slate-500">SELESAI & DIAMBIL</div>
              </div>
            </div>
          </div>
        </div>
      )}

    </div>
  );
}

// Mount React Root
const rootElement = document.getElementById('root');
if (rootElement) {
  const root = ReactDOM.createRoot(rootElement);
  root.render(<App />);
}

  </script>
</body>
</html>
